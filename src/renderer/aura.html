<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>aura</title>
  </head>
  <body>
    <svg class="aura" width="64" height="64" viewBox="-16 -16 64 64" aria-hidden="true">
      <defs>
        <linearGradient id="aura-gradient" gradientUnits="userSpaceOnUse" x1="-2" y1="0" x2="14" y2="20">
          <stop offset="0" stop-color="#8b5cf6" />
          <stop offset="0.5" stop-color="#38bdf8" />
          <stop offset="1" stop-color="#f472b6" />
          <animateTransform
            attributeName="gradientTransform"
            type="rotate"
            from="0 6 10"
            to="360 6 10"
            dur="2.4s"
            repeatCount="indefinite"
          />
        </linearGradient>
        <path id="arrow" d="M0 0 L0 17.5 L4.2 13.6 L7 20 L9.6 18.9 L6.9 12.6 L12.4 12.6 Z" />
      </defs>
      <g class="pulse">
        <use class="glow" href="#arrow" />
        <use class="outline" href="#arrow" />
      </g>
    </svg>
    <script type="module" src="./src/aura/aura.ts"></script>
  </body>
</html>
